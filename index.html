<!DOCTYPE html>
<html lang="ja" data-lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORIRIS｜モリリス公式サイト</title>
<meta name="description" content="モリリスという世界がある。人間は、いない。理由は誰も知らない。不思議な生き物たちが、今日も静かに生きている。">
<link rel="icon" type="image/png" href="assets/icon00.png">

<!-- ==========================================================
     Google Fonts
     日本語：Noto Sans JP（細めのゴシック） / 英語：Cormorant Garamond（セリフ体）
     ========================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400;500&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&amp;display=swap" rel="stylesheet">

<style>
  /* ==========================================================
     基本設定・変数定義
     カラーイメージ：ダークグリーン／くすんだ茶／霧がかった灰色
     ========================================================== */
  :root {
    --color-bg: #14150f;          /* ベース：ほぼ黒に近い闇 */
    --color-bg-deep: #0b0c08;     /* さらに深い闇 */
    --color-moss: #4a5a44;        /* ダークグリーン */
    --color-moss-dim: #333c2e;    /* 暗いモスグリーン */
    --color-mist: #d9dad2;        /* 霧がかった灰色（明） */
    --color-mist-dim: #9a988e;    /* 霧がかった灰色（暗） */
    --color-rust: #5a4632;        /* くすんだ茶 */
    --color-rust-dim: #3a2f22;    /* 暗いくすんだ茶 */
    --color-border: rgba(217, 218, 210, 0.16);
    --font-jp: 'Noto Sans JP', "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --font-en: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --section-pad: 6rem 1.5rem;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background-color: var(--color-bg);
    color: var(--color-mist);
    font-family: var(--font-jp);
    font-weight: 300;
    line-height: 2;
    letter-spacing: 0.05em;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  html[data-lang="en"] body {
    font-family: var(--font-en);
    letter-spacing: 0.02em;
  }

  img {
    max-width: 100%;
    display: block;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  ul {
    list-style: none;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
  }

  /* ==========================================================
     フェードインアニメーション（控えめ）
     ========================================================== */
  .fade-in {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }

  .fade-in.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .fade-in {
      opacity: 1;
      transform: none;
      transition: none;
    }
    html {
      scroll-behavior: auto;
    }
    .hero-fog,
    .world-fog {
      animation: none !important;
    }
  }

  /* ==========================================================
     HEADER（ロゴ＋ナビゲーション＋言語切り替え）
     ========================================================== */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    padding: 1.2rem 1rem;
    z-index: 100;
    background: linear-gradient(to bottom, rgba(11,12,8,0.85) 0%, rgba(11,12,8,0) 100%);
  }

  .site-logo {
    font-family: var(--font-en);
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: var(--color-mist);
    flex-shrink: 0;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }

  .site-nav {
    display: flex;
    gap: 0.5rem;
  }

  .site-nav a {
    font-family: var(--font-en);
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    color: var(--color-mist-dim);
    padding: 0.4rem 0;
    border-bottom: 1px solid transparent;
    white-space: nowrap;
    transition: color 0.4s ease, border-color 0.4s ease;
  }

  .site-nav a:hover,
  .site-nav a:focus-visible {
    color: var(--color-mist);
    border-bottom-color: var(--color-moss);
  }

  /* 言語切り替え */
  .lang-toggle {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-family: var(--font-en);
    flex-shrink: 0;
  }

  .lang-btn {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    padding: 0.3rem 0.45rem;
    color: var(--color-mist-dim);
    border: 1px solid transparent;
    border-radius: 999px;
    transition: color 0.4s ease, border-color 0.4s ease;
  }

  .lang-btn.is-active {
    color: var(--color-mist);
    border-color: var(--color-border);
  }

  .lang-btn:hover,
  .lang-btn:focus-visible {
    color: var(--color-mist);
  }

  .lang-sep {
    color: var(--color-mist-dim);
    font-size: 0.65rem;
    opacity: 0.5;
  }

  /* ==========================================================
     共通セクションスタイル
     ========================================================== */
  section {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--section-pad);
    text-align: center;
  }

  .section-label {
    font-family: var(--font-en);
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    color: var(--color-moss);
    margin-bottom: 1.6rem;
    text-transform: uppercase;
  }

  .section-inner {
    max-width: 34rem;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  /* ==========================================================
     SECTION 0 : HERO
     廃墟・霧のイメージをCSSのみで表現
     ========================================================== */
  .section-hero {
    background:
      radial-gradient(ellipse at 50% 15%, rgba(74,90,68,0.16) 0%, transparent 55%),
      linear-gradient(to bottom, var(--color-bg-deep) 0%, var(--color-rust-dim) 55%, var(--color-bg-deep) 100%);
    overflow: hidden;
  }

  /* 崩れた柱・廃墟のシルエット（CSSのみ） */
  .hero-ruins {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(0,0,0,0.55) 0px,
        rgba(0,0,0,0.55) 3px,
        transparent 3px,
        transparent 38px
      ),
      linear-gradient(
        to top,
        rgba(0,0,0,0.65) 0%,
        rgba(0,0,0,0.65) 32%,
        transparent 32%
      );
    background-size: 100% 100%, 76px 100%;
  }

  .hero-ruins::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center 30%, transparent 25%, var(--color-bg-deep) 92%);
  }

  .hero-fog {
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: 0;
    height: 46%;
    background: linear-gradient(to top, rgba(217,218,210,0.07), transparent);
    z-index: 1;
    pointer-events: none;
    animation: fog-drift 70s ease-in-out infinite alternate;
  }

  @keyframes fog-drift {
    from { transform: translateX(-3%); opacity: 0.85; }
    to   { transform: translateX(3%); opacity: 1; }
  }

  .hero-copy {
    position: relative;
    z-index: 2;
  }

  .hero-catch {
    font-size: 1.7rem;
    font-weight: 300;
    line-height: 1.9;
    color: var(--color-mist);
  }

  html[data-lang="en"] .hero-catch {
    font-style: italic;
    font-weight: 400;
  }

  /* ==========================================================
     SECTION 1 : WORLD
     ========================================================== */
  .section-world {
    background: linear-gradient(to bottom, var(--color-bg) 0%, var(--color-bg-deep) 100%);
    overflow: hidden;
  }

  .world-mist {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 20% 30%, rgba(74,90,68,0.12), transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 70%, rgba(90,70,50,0.12), transparent 70%);
  }

  .world-copy {
    position: relative;
    z-index: 2;
  }

  .world-text {
    font-size: 1.05rem;
    line-height: 2.2;
    color: var(--color-mist-dim);
  }

  /* ==========================================================
     SECTION 2 : CHARACTER
     ========================================================== */
  .section-character {
    background: var(--color-bg-deep);
  }

  .character-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 3rem 1.5rem;
    margin-top: 1rem;
  }

  .character-card {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .character-avatar {
    width: 8.5rem;
    height: 8.5rem;
    margin: 0 auto 1.4rem;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 35% 30%, var(--color-moss-dim), var(--color-bg-deep) 75%);
    border: 1px solid var(--color-border);
  }

  .character-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .character-name {
    font-size: 1rem;
    letter-spacing: 0.15em;
    margin-bottom: 0.9rem;
    color: var(--color-mist);
  }

  .character-desc {
    font-size: 0.9rem;
    color: var(--color-mist-dim);
    line-height: 1.9;
  }

  /* ==========================================================
     SECTION 3 : SNS
     ========================================================== */
  .section-sns {
    background: var(--color-bg);
  }

  .sns-heading {
    font-size: 1.4rem;
    font-weight: 300;
    color: var(--color-mist);
    margin-bottom: 2.6rem;
  }

  html[data-lang="en"] .sns-heading {
    font-style: italic;
  }

  .sns-links {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 1.6rem;
  }

  .sns-icon-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 3.4rem;
    height: 3.4rem;
    border-radius: 50%;
    border: 1px solid var(--color-border);
    color: var(--color-mist-dim);
    transition: color 0.4s ease, border-color 0.4s ease, transform 0.3s ease;
  }

  .sns-icon-link svg {
    width: 1.4rem;
    height: 1.4rem;
  }

  .sns-icon-link:hover,
  .sns-icon-link:focus-visible {
    color: var(--color-mist);
    border-color: var(--color-moss);
    transform: translateY(-2px);
  }

  /* ==========================================================
     FOOTER
     ========================================================== */
  .site-footer {
    padding: 2.6rem 1.5rem 3rem;
    text-align: center;
    background: var(--color-bg-deep);
  }

  .site-footer p {
    font-family: var(--font-en);
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: var(--color-mist-dim);
  }

  /* ==========================================================
     レスポンシブ（タブレット以上）
     ========================================================== */
  @media (min-width: 640px) {
    .site-header {
      padding: 2rem 3rem;
    }

    .site-logo {
      font-size: 1.15rem;
      letter-spacing: 0.3em;
    }

    .header-right {
      gap: 2rem;
    }

    .site-nav {
      gap: 2rem;
    }

    .site-nav a {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
    }

    .hero-catch {
      font-size: 2.3rem;
    }

    .world-text {
      font-size: 1.2rem;
    }

    .character-grid {
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem 1.5rem;
    }

    .character-avatar {
      width: 9.5rem;
      height: 9.5rem;
    }

    .sns-heading {
      font-size: 1.8rem;
    }
  }

  @media (min-width: 640px) and (max-width: 899px) {
    .character-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
<body>

<!-- ==========================================================
     HEADER
     ========================================================== -->
<header class="site-header">
  <div class="site-logo">MORIRIS</div>
  <div class="header-right">
    <nav class="site-nav">
      <a href="#world">WORLD</a>
      <a href="#character">CHARACTER</a>
      <a href="#sns">SNS</a>
    </nav>
    <div class="lang-toggle" role="group" aria-label="Language / 言語">
      <button type="button" class="lang-btn" data-lang-btn="ja">JP</button>
      <span class="lang-sep" aria-hidden="true">/</span>
      <button type="button" class="lang-btn" data-lang-btn="en">EN</button>
    </div>
  </div>
</header>

<main>

  <!-- ==========================================================
       SECTION 0 : HERO
       ========================================================== -->
  <section id="hero" class="section-hero">
    <div class="hero-ruins" aria-hidden="true"></div>
    <div class="hero-fog" aria-hidden="true"></div>
    <div class="section-inner hero-copy fade-in">
      <h1 class="hero-catch" data-jp="人間がいない世界。" data-en="A world without humans."></h1>
    </div>
  </section>

  <!-- ==========================================================
       SECTION 1 : WORLD
       ========================================================== -->
  <section id="world" class="section-world">
    <div class="world-mist" aria-hidden="true"></div>
    <div class="section-inner world-copy fade-in">
      <p class="section-label">World</p>
      <p class="world-text"
         data-jp="モリリスという世界がある。&lt;br&gt;人間は、いない。理由は誰も知らない。&lt;br&gt;不思議な生き物たちが、今日も静かに生きている。"
         data-en="There is a world called Moriris.&lt;br&gt;Humans are gone. No one knows why.&lt;br&gt;Strange creatures still live there, quietly, today."></p>
    </div>
  </section>

  <!-- ==========================================================
       SECTION 2 : CHARACTER
       ========================================================== -->
  <section id="character" class="section-character">
    <div class="section-inner fade-in">
      <p class="section-label">Character</p>

      <div class="character-grid">
        <article class="character-card">
          <div class="character-avatar">
            <img class="character-image" src="assets/character01.png" alt="ノム">
          </div>
          <p class="character-name">ノム</p>
          <p class="character-desc" data-jp="よく寝る。それだけでいい。" data-en="Sleeps a lot. That&#39;s enough."></p>
        </article>

        <article class="character-card">
          <div class="character-avatar">
            <img class="character-image" src="assets/character02.png" alt="モル">
          </div>
          <p class="character-name">モル</p>
          <p class="character-desc" data-jp="臆病だけど、雨の日は外に出る。" data-en="Timid, but goes outside on rainy days."></p>
        </article>

        <article class="character-card">
          <div class="character-avatar">
            <img class="character-image" src="assets/character03.png" alt="ゾム">
          </div>
          <p class="character-name">ゾム</p>
          <p class="character-desc" data-jp="昔のことをよく覚えている。誰も聞かない。" data-en="Remembers the old days well. No one asks."></p>
        </article>

        <article class="character-card">
          <div class="character-avatar">
            <img class="character-image" src="assets/character04.png" alt="ミル">
          </div>
          <p class="character-name">ミル</p>
          <p class="character-desc" data-jp="池の底で何かを探している。まだ見つかっていない。" data-en="Searching for something at the bottom of the pond. Not found yet."></p>
        </article>
      </div>
    </div>
  </section>

  <!-- ==========================================================
       SECTION 3 : SNS
       ========================================================== -->
  <section id="sns" class="section-sns">
    <div class="section-inner fade-in">
      <p class="section-label">SNS</p>
      <h2 class="sns-heading" data-jp="つながる" data-en="Follow us"></h2>

      <div class="sns-links">
        <a class="sns-icon-link" href="https://www.tiktok.com/@moriris_world" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 3v10.2a3.3 3.3 0 1 1-2.6-3.23"/>
            <path d="M14 3c.4 2.4 2 4 4.6 4.3"/>
          </svg>
        </a>
        <a class="sns-icon-link" href="https://www.instagram.com/moriris_world" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17" cy="7" r="0.8" fill="currentColor" stroke="none"/>
          </svg>
        </a>
      </div>
    </div>
  </section>

</main>

<!-- ==========================================================
     FOOTER
     ========================================================== -->
<footer class="site-footer">
  <p>© MORIRIS</p>
</footer>

<script>
  // ==========================================================
  // 言語切り替え（JP / EN・localStorage保存・ページリロードなし）
  // ==========================================================
  (function () {
    var STORAGE_KEY = 'moriris-lang';
    var htmlEl = document.documentElement;
    var translatable = document.querySelectorAll('[data-jp]');
    var langButtons = document.querySelectorAll('[data-lang-btn]');

    function applyLang(lang) {
      translatable.forEach(function (el) {
        var text = el.getAttribute(lang === 'en' ? 'data-en' : 'data-jp');
        if (text != null) {
          el.innerHTML = text;
        }
      });

      htmlEl.setAttribute('lang', lang);
      htmlEl.setAttribute('data-lang', lang);

      langButtons.forEach(function (btn) {
        var isActive = btn.getAttribute('data-lang-btn') === lang;
        btn.classList.toggle('is-active', isActive);
        btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });

      try {
        localStorage.setItem(STORAGE_KEY, lang);
      } catch (e) {
        /* localStorageが使えない環境では保存をスキップ */
      }
    }

    var saved = null;
    try {
      saved = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      saved = null;
    }

    applyLang(saved === 'en' ? 'en' : 'ja');

    langButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        applyLang(btn.getAttribute('data-lang-btn'));
      });
    });
  })();

  // ==========================================================
  // フェードインアニメーション制御（IntersectionObserver）
  // ==========================================================
  (function () {
    var targets = document.querySelectorAll('.fade-in');

    if (!('IntersectionObserver' in window)) {
      targets.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });

    targets.forEach(function (el) { observer.observe(el); });
  })();
</script>

</body>
